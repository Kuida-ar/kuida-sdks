name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    name: ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [node, python, dotnet, java, php, go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: matrix.sdk == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - if: matrix.sdk == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - if: matrix.sdk == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: matrix.sdk == 'php'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          extensions: curl, json
          tools: composer
      - if: matrix.sdk == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Instalar dependencias
        run: |
          case "${{ matrix.sdk }}" in
            node)   cd node && npm ci && npm run build ;;
            python) cd python && python -m pip install -e ".[test]" ;;
            php)    cd php && composer install --no-interaction ;;
            *) ;;
          esac
      - name: Suite de conformidad
        run: conformance/run.sh ${{ matrix.sdk }}
