name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    name: ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [node, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: matrix.sdk == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Instalar dependencias
        run: |
          case "${{ matrix.sdk }}" in
            node)   cd node && npm ci && npm run build ;;
            python) cd python && python -m pip install -e ".[test]" ;;
            *) ;;
          esac
      - name: Suite de conformidad
        run: conformance/run.sh ${{ matrix.sdk }}
