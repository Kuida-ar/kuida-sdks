name: Release

# Publica un SDK al pushear un tag:
#   node-v0.1.1    → npm (@kuida/sdk)
#   python-v0.1.1  → PyPI (kuida)
# Sin tokens: npm y PyPI confían en este workflow por OIDC (trusted publishing).
# La versión del tag tiene que coincidir con la del package.json / pyproject.toml.

on:
  push:
    tags: ["node-v*", "python-v*"]

jobs:
  node:
    if: startsWith(github.ref_name, 'node-v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Versión del tag = versión del paquete
        run: test "node-v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm run build
      - name: Conformidad
        run: cd .. && conformance/run.sh node
      - run: npm publish

  python:
    if: startsWith(github.ref_name, 'python-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Versión del tag = versión del paquete
        run: test "python-v$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" = "${GITHUB_REF_NAME}"
      - run: python -m pip install -e ".[test]" build
      - name: Conformidad
        run: cd .. && conformance/run.sh python
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
