[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "kuida"
version = "0.1.0"
description = "SDK oficial de Kuida para Python: pacientes, turnos, consultas, eventos y webhooks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kuida", email = "desarrolladores@kuida.ar" }]
keywords = ["kuida", "salud", "pacientes", "whatsapp", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.23,<1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://www.kuida.ar/desarrolladores"
Documentation = "https://www.kuida.ar/desarrolladores"
Source = "https://github.com/Kuida-ar/kuida-sdks/tree/main/python"

[tool.hatch.build.targets.wheel]
packages = ["src/kuida"]

[tool.hatch.build.targets.sdist]
include = ["src/kuida", "scripts", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
